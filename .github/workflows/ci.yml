name: CI

# Same checks as `just check` (test, typecheck, lint). Tests use temporary
# SQLite stores and no external services, so no secrets are needed.
# Python 3.11 is the supported floor (requires-python, ruff and mypy target);
# 3.14 is the current development interpreter. The Python tests include the
# drift test of the Rust port's fixtures (rust/fixtures, rust/PLAN.md 7.2).
# The Rust port in rust/ runs in the `rust` job (`just rs-check` plus
# cargo-deny, a release build and a `--version` smoke test) on Linux and
# macOS (rust/PLAN.md 7.6), with tmux installed for the runner's integration
# tests; the black-box API parity harness in
# rust/parity/api runs in the `parity-api` job (rust/PLAN.md 7.3). The
# `parity-runner` job runs the black-box runner parity harness
# (rust/parity/runner, rust/PLAN.md 7.4) with real tmux on Linux and macOS:
# against the Python runner now, against the Rust runner once slice S6b has
# landed (S8 switches that leg on).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  python:
    name: Lint, typecheck and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies (just _sync)
        run: uv sync --extra dev
      - name: Tests (just test)
        run: uv run pytest
      - name: Typecheck (just typecheck)
        run: uv run mypy src tests
      - name: Lint (just lint)
        run: uv run ruff check src tests

  parity-api:
    # rust/PLAN.md 7.3: black-box API scenarios against a real `python -m opsgate serve` process per
    # scenario. The Rust leg (release build, `--impl rust`, record diff with compare.py) is switched on
    # by slice S4a together with harness.RUST_SLICES_LANDED.
    name: API parity harness (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies (just _sync)
        run: uv sync --extra dev
      - name: Lint and typecheck the harness
        run: |
          uv run ruff check rust/parity
          uv run ruff format --check rust/parity
          uv run mypy rust/parity/api
      - name: Scenarios against Python
        run: uv run pytest rust/parity/api -rs --impl python --records "$RUNNER_TEMP/parity-api/python"

  rust:
    name: Rust port (${{ matrix.os }}; fmt, clippy, deny, tests, release build)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo-deny-target: x86_64-unknown-linux-musl
            cargo-deny-sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          - os: macos-15
            cargo-deny-target: aarch64-apple-darwin
            cargo-deny-sha256: fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Format (cargo fmt)
        run: cargo fmt --all --check
      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-deny (pinned release, sha256 checked)
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_TARGET: ${{ matrix.cargo-deny-target }}
          CARGO_DENY_SHA256: ${{ matrix.cargo-deny-sha256 }}
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-${CARGO_DENY_TARGET}"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/${name}.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/${name}.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-deny" --version
      - name: Supply chain (cargo deny, rust/deny.toml)
        run: cargo deny --locked check
      - name: Install tmux (runner integration tests, rust/PLAN.md 7.1)
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update -q
              sudo apt-get install -y -q tmux
            fi
          fi
          tmux -V
      - name: Tests (cargo test)
        # The runner's tmux integration tests fail instead of skipping when tmux is missing.
        env:
          OPSGATE_REQUIRE_TMUX: "1"
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test (--version names version and commit)
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -I -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "opsgate"))')
          expected="opsgate ${version} (${GITHUB_SHA})"
          actual=$(target/release/opsgate --version)
          echo "${actual}"
          test "${actual}" = "${expected}" || { echo "expected: ${expected}"; exit 1; }
      - name: Binary size
        run: |
          size=$(wc -c < target/release/opsgate | tr -d ' ')
          echo "opsgate release binary (${{ matrix.os }}): ${size} bytes"
          echo "opsgate release binary (${{ matrix.os }}): ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

  parity-runner:
    name: Runner parity harness (${{ matrix.os }}; Python runner)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      UV_PYTHON: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Show tmux version
        run: tmux -V
      - name: Sync locked dependencies (just _sync)
        run: uv sync --extra dev
      - name: Lint and typecheck the harness
        run: |
          uv run ruff check rust/parity/runner
          uv run ruff format --check rust/parity/runner
          uv run mypy rust/parity/runner
      - name: Runner parity harness against Python
        run: uv run pytest rust/parity/runner --impl python --records "$RUNNER_TEMP/parity-runner/python"
      - name: Records are comparable
        run: uv run python rust/parity/runner/compare.py "$RUNNER_TEMP/parity-runner/python"
