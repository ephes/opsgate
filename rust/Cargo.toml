[workspace]
resolver = "3"
members = [
    "crates/opsgate-core",
    "crates/opsgate-store",
    "crates/opsgate-web",
    "crates/opsgate-runner",
    "crates/opsgate",
]

# The Rust port starts at 0.3.0 (Python is 0.2.0), so `opsgate --version` and
# the release tag `rs-v<version>` tell operators which implementation runs
# (PLAN.md section 0).
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ephes/opsgate"
publish = false

# Shared dependency versions. Slices add the crates they need here (PLAN.md
# 6.2) and refer to them with `workspace = true` from their crate manifests.
[workspace.dependencies]
opsgate-core = { path = "crates/opsgate-core" }
opsgate-store = { path = "crates/opsgate-store" }
opsgate-web = { path = "crates/opsgate-web" }
opsgate-runner = { path = "crates/opsgate-runner" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
gethostname = "1"
ipnet = "2"
tempfile = "3"
# JSON with number tokens preserved (PLAN.md 4.8, 6.2): the checksum formatter
# classifies and re-renders every token itself and sorts object keys itself,
# so a crate that enables serde_json's `preserve_order` cannot change it.
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
ryu = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Runner (PLAN.md 6.1, 6.2): one tokio runtime, tmux and probes as
# `tokio::process` children, the API client over plain HTTP (no TLS, D-10).
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.13", default-features = false }
shlex = "2"
# Logging (PLAN.md 4.15): plain lines on stderr, no ANSI colours.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Test-only fake API of the runner tests (PLAN.md 7.1).
axum = { version = "0.8", default-features = false }
# Store (PLAN.md 6.2): SQLite with a pinned, bundled library (the same
# SQLite on macOS and in CI), constant-time compare, ticket ids; regex for
# the store tests and the runner's ticket-id and tmux-session patterns.
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
subtle = "2"
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
# Web (PLAN.md 6.2, 6.3; slice S4a): the session cookie (the `cookie` crate's
# private jar, AES-256-GCM, keyed through HKDF-SHA256), the Jinja templates
# shared with Python, percent-encoding for paths, forms and `url_for`, and
# random CSRF tokens (`secrets.token_urlsafe(32)`).
base64 = "0.22"
cookie = { version = "0.18", default-features = false, features = ["private"] }
getrandom = "0.4"
hkdf = "0.13"
http-body-util = "0.1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "std_collections"] }
percent-encoding = "2"
tower = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
