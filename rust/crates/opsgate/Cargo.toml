[package]
name = "opsgate"
description = "OpsGate control service and runner (Rust port)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "opsgate"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap.workspace = true
opsgate-core.workspace = true
opsgate-runner.workspace = true
opsgate-store.workspace = true
opsgate-web.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
