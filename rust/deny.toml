# cargo-deny policy for the Rust port (PLAN.md R8): run by the CI `rust` job
# and `just rs-deny`. Only the release target (PLAN.md section 9) is checked,
# so the result is the same on every host. A new license needs a deliberate
# addition here; advisories (RustSec) and yanked crates fail the check; crates
# come from crates.io only. Later slices add the licenses their crates bring.
[graph]
targets = ["aarch64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
